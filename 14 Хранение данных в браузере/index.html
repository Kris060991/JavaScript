<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <script src="https://unpkg.com/just-validate@latest/dist/just-validate.production.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <form id="film-form" class="form" action="#">
      <div class="form-wrapper">
        <label class="form-label" for="title">Название:</label>
        <div class="form-input-wrapper">
          <input class="form-input" type="text" name="title" id="title">
        </div>
      </div>
      <div class="form-wrapper">
        <label class="form-label" for="genre">Жанр:</label>
        <div class="form-input-wrapper">
          <input class="form-input" type="text" name="genre" id="genre">
        </div>
      </div>
      <div class="form-wrapper">
        <label class="form-label" for="year">Год:</label>
        <div class="form-input-wrapper">
          <input class="form-input" type="text" name="year" id="year">
        </div>
      </div>
      <div class="form-wrapper">
        <div class="form-checkbox">
          <input type="checkbox" name="isWatched" id="isWatched">
        </div>
        <label class="form-label" for="isWatched">Успели посмотреть?</label>
      </div>

      <button class="btn" type="submit">Добавить</button>
    </form>

    <div class="sort-wrapper">
      <select id="sort-by" class="sort-select">
        <option value="title">Название</option>
        <option value="genre">Жанр</option>
        <option value="year">Год</option>
      </select>
      <button id="sort-btn" class="sort-btn">Сортировать</button>
    </div>

    <table id="film-table" class="film-table">
      <thead class="film-thead">
        <tr class="film-tr">
          <th>Название</th>
          <th>Жанр</th>
          <th>Год</th>
          <th>Успели посмотреть?</th>
          <th>Действие</th>
        </tr>
      </thead>
      <tbody id="film-tbody" class="film-tbody">

      </tbody>
    </table>
  </div>

  <script src="index.js"></script>
</body>

</html>
